name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o install.sh
          bash install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: moon fmt --check

      - name: Type-check
        run: moon check

      - name: Run tests
        run: moon test

      - name: CLI smoke test (parse)
        run: moon run cmd/moon-wit -- parse tests/hello-world.wit

      - name: CLI smoke test (gen)
        run: |
          moon run cmd/moon-wit -- gen tests/hello-world.wit -o examples/hello
          moon run cmd/moon-wit -- gen tests/escaped-identifiers.wit -o examples/escaped
          moon run cmd/moon-wit -- gen tests/calculator.wit -o examples/calculator
          moon run cmd/moon-wit -- gen tests/resource.wit -o examples/resource

      - name: Build (CLI + generated examples)
        run: moon build

      - name: Verify release package
        run: moon package --list

      - name: Check generated example is current
        run: git diff --exit-code -- examples

      - name: Check generated package interfaces are current
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
