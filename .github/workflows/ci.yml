name: CI

on:
  push:
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o install.sh
          bash install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: moon fmt --check

      - name: Type-check
        run: moon check

      - name: Run tests
        run: moon test

      - name: CLI smoke test (parse)
        run: moon run cmd/moon-wit -- parse tests/hello-world.wit

      - name: CLI smoke test (gen)
        run: moon run cmd/moon-wit -- gen tests/hello-world.wit -o examples/hello

      - name: Build (CLI + generated examples)
        run: moon build
